<script>
/* Phones: the address bar slides away and back as you scroll, which changes innerHeight and fires "resize" on nearly
   every swipe. The rooms are measured against innerHeight, so they would jump and the pictures would be redrawn each
   time. On a touch screen the page keeps the height it had and takes a new one only when the width changes (the phone
   is turned) or the height changes by more than an address bar would (the keyboard opens). */
(() => {
  if (!matchMedia("(pointer: coarse)").matches) return;
  const d = Object.getOwnPropertyDescriptor(window, "innerHeight") || Object.getOwnPropertyDescriptor(Window.prototype, "innerHeight");
  if (!d || !d.get || !d.configurable) return;
  const real = () => d.get.call(window);
  let w = innerWidth, h = real();
  try { Object.defineProperty(window, "innerHeight", { configurable: true, get: () => h }); } catch (e) { return; }
  addEventListener("resize", (e) => {
    const nw = innerWidth, nh = real();
    if (nw !== w || Math.abs(nh - h) > 160) { w = nw; h = nh; return; }
    e.stopImmediatePropagation();
  }, true);
})();
</script>
<script>document.documentElement.classList.add("js"); try { localStorage.removeItem("quiet"); var q = sessionStorage.getItem("quiet"); if (q === "1" || (q === null && matchMedia("(prefers-reduced-motion: reduce)").matches)) document.documentElement.classList.add("quiet"); } catch (e) {}</script>

<!-- the brand is chosen from the address; the page takes the brand's own world (brand.js) -->
<script>
  var BRAND_AT = Math.max(0, DATA.brands.findIndex(function (b) { return b.slug === new URLSearchParams(location.search).get("b"); }));
  var BRAND = DATA.brands[BRAND_AT];
  document.title = BRAND.name + ", a brand by Lana Huertas";
</script>
<script>
/* The pictures come in smaller copies (art/w, made by scripts/moon/variants.py at these widths, never wider than the
   picture itself), so a phone fetches a picture at the size it shows it. srcsetOf(src, width) lists the copies and the
   original; kvSizes(a, h) says how wide a key visual of width-to-height a is shown: on a phone or an upright screen
   the width of the column, no taller than 62% of the window, and beside the words no wider than 52u nor taller than
   h u. These are shared with brand.js, which writes the same lists into the page. */
var VARIANTS = [320, 480, 960, 1600];
function variant(src, w) { return "/samples/sleeping-moon/art/w" + src.replace(/\.[a-z0-9]+$/i, "") + "-" + w + ".webp"; }
function srcsetOf(src, ow) { return VARIANTS.filter(function (w) { return w < ow; }).map(function (w) { return variant(src, w) + " " + w + "w"; }).concat(src + " " + ow + "w").join(", "); }
function kvSizes(a, h) {
  var col = "min(calc(100vw - 32px), " + (62 * a).toFixed(1) + "vh)";
  return "(max-width: 760px) " + col + ", (max-aspect-ratio: 1/1) " + col + ", (max-height: 500px) " + col + ", min(52vw, " + (h * a).toFixed(1) + "vw)";
}
/* the key visual is the largest thing on the first screen, so it is asked for now, first, rather than once the page
   has been laid out */
(function () {
  var i = BRAND.imgs[0], l = document.createElement("link");
  l.rel = "preload"; l.as = "image"; l.href = i[0];
  l.setAttribute("imagesrcset", srcsetOf(i[0], i[2])); l.setAttribute("imagesizes", kvSizes(i[2] / i[3], 48)); l.setAttribute("fetchpriority", "high");
  document.head.appendChild(l);
})();
</script>
