<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample 1: Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* BLOOM. One closed flower in a night garden. Open it and the six parts of the
   site burst from its heart and settle into a ring that turns round the bloom.
   The flower and the ring are real 3D (CSS transforms in one shared space). */
body { overflow: hidden; }
.scene { position: fixed; inset: 0; overflow: hidden; }
.deco { position: absolute; pointer-events: none; }
.top { position: absolute; left: 0; right: 0; top: clamp(20px, 6vh, 64px); z-index: 5; text-align: center; padding: 0 16px; transition: transform 0.9s var(--ease), opacity 0.6s; }
.top .role { margin-inline: auto; }
[data-state="open"] .top { transform: translateY(-2vh) scale(0.62); transform-origin: 50% 0; }
[data-state="open"] .top .role { opacity: 0; }

.stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 38%; }
.world { position: absolute; left: 50%; top: 68%; width: 0; height: 0; transform-style: preserve-3d; transform: translateZ(-380px) rotateX(-9deg); }

/* the flower: two rings of petals hinged at the heart */
.flower { position: absolute; transform-style: preserve-3d; transform: rotateX(62deg); transition: transform 1.2s var(--ease); }
[data-state="open"] .flower { transform: rotateX(66deg) scale(1.12); }
.petal {
  position: absolute;
  left: calc(var(--w) / -2);
  bottom: 0;
  width: var(--w);
  height: var(--h);
  transform-origin: 50% 100%;
  transform: rotateZ(var(--a)) rotateX(var(--shut));
  border-radius: 50% 50% 46% 46% / 72% 72% 28% 28%;
  background: linear-gradient(0deg, #4a22a8 0%, #8a5cf0 38%, #d9b8ff 78%, #fff6ff 100%);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.5), inset 0 -30px 40px rgb(238 139 228 / 0.45);
  transition: transform 1.3s var(--pop);
  transition-delay: calc(var(--i) * 45ms);
}
.petal.out { --w: clamp(84px, 9vw, 132px); --h: clamp(170px, 19vw, 270px); --shut: -84deg; --wide: -24deg; }
.petal.in { --w: clamp(60px, 6.4vw, 96px); --h: clamp(120px, 13vw, 190px); --shut: -88deg; --wide: -50deg; background: linear-gradient(0deg, #6a2fc0 0%, #c98af5 50%, #ffe9fb 100%); }
[data-state="open"] .petal { transform: rotateZ(var(--a)) rotateX(var(--wide)); }
.heart {
  position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff6dc, #ffd98a 45%, #ee8be4 100%);
  transform: translateZ(8px) scale(0.2); transition: transform 0.9s var(--pop) 0.3s;
  box-shadow: 0 0 60px 18px rgb(255 217 138 / 0.55);
}
[data-state="open"] .heart { transform: translateZ(8px) scale(1); }

/* the ring: six cards on a circle round the flower */
.spin { position: absolute; transform-style: preserve-3d; }
[data-state="open"] .spin { animation: spin 80s linear infinite; }
@keyframes spin { to { transform: rotateY(-360deg); } }
.ring { position: absolute; transform-style: preserve-3d; transition: transform 0.9s var(--ease); }
.ring .card {
  --R: clamp(170px, 34vw, 520px);
  position: absolute;
  left: calc(var(--cw) / -2);
  top: calc(var(--ch) * -1 - 2vh);
  width: var(--cw);
  height: var(--ch);
  --cw: clamp(130px, 16vw, 250px);
  --ch: clamp(170px, 21vw, 320px);
  transform: rotateY(var(--a)) translateZ(0) translateY(40vh) scale(0.05);
  opacity: 0;
  transition: transform 1.25s var(--pop), opacity 0.4s;
  transition-delay: calc(var(--i) * 90ms + 420ms);
}
[data-state="open"] .ring .card { transform: rotateY(var(--a)) translateZ(var(--R)); opacity: 1; }
.ring .card:hover { box-shadow: 0 0 0 2px var(--moon), 0 0 50px rgb(185 162 255 / 0.8); }

.open-btn { position: absolute; left: 50%; top: 80%; z-index: 6; transform: translateX(-50%); transition: opacity 0.4s; }
[data-state="open"] .open-btn { opacity: 0; pointer-events: none; }
.turn { position: absolute; top: 46%; z-index: 6; width: 52px; height: 52px; border: 1px solid var(--lilac); border-radius: 50%; background: rgb(15 8 34 / 0.8); font-size: 20px; opacity: 0; pointer-events: none; transition: opacity 0.5s 1.4s; }
.turn.l { left: 3vw; } .turn.r { right: 3vw; }
[data-state="open"] .turn { opacity: 1; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { .petal, .ring .card, .heart, .top, .flower { transition: none; } [data-state="open"] .spin { animation: none; } }
</style>
</head>
<body>
<main class="scene" data-state="closed">
  <div class="sky"></div><div class="stars"></div>
  <img class="deco px twinkle" style="--d:-14;right:9%;top:9%;width:clamp(70px,9vw,130px)" src="art/orb.svg" alt="">
  <img class="deco px twinkle" style="--d:10;left:12%;top:22%;width:34px;--td:-2s" src="art/spark.svg" alt="">
  <img class="deco px twinkle" style="--d:16;right:22%;top:34%;width:22px;--td:-3.2s" src="art/spark.svg" alt="">
  <img class="deco px" style="--d:26;left:-2%;bottom:-3%;height:44vh" src="art/fern.svg" alt="">
  <img class="deco px" style="--d:30;right:-1%;bottom:-4%;height:50vh" src="art/fern.svg" alt="">
  <img class="deco px float" style="--d:20;left:10%;bottom:4%;height:30vh" src="art/bell.svg" alt="">
  <img class="deco px float" style="--d:22;right:12%;bottom:2%;height:34vh;--td:-4s" src="art/bell-deep.svg" alt="">
  <img class="deco px float" style="--d:36;left:24%;bottom:-5%;width:16vh;--td:-2s" src="art/blossom-deep.svg" alt="">
  <img class="deco px float" style="--d:40;right:26%;bottom:-6%;width:19vh;--td:-6s" src="art/blossom.svg" alt="">

  <header class="top">
    <h1 class="name">Lana Denise <em>Huertas</em></h1>
    <p class="role">UI/UX and visual designer. The garden is closed. Open it.</p>
  </header>

  <div class="stage">
    <div class="world">
      <div class="spin"><div class="ring" id="ring"></div></div>
      <div class="flower" id="flower"><span class="heart"></span></div>
    </div>
  </div>

  <button class="cta open-btn" id="open">Open the garden</button>
  <button class="turn l" id="prev" aria-label="Turn the ring left">←</button>
  <button class="turn r" id="next" aria-label="Turn the ring right">→</button>
</main>
<script src="base.js"></script>
<script>
const scene = document.querySelector(".scene"), flower = document.getElementById("flower"), ring = document.getElementById("ring");
for (let i = 0; i < 9; i++) flower.insertAdjacentHTML("afterbegin", `<span class="petal out" style="--a:${i * 40}deg;--i:${i}"></span>`);
for (let i = 0; i < 6; i++) flower.insertAdjacentHTML("beforeend", `<span class="petal in" style="--a:${i * 60 + 20}deg;--i:${i + 4}"></span>`);
ring.innerHTML = PARTS.slice(0, 6).map((p, i) => card(p, `style="--a:${i * 60}deg;--i:${i}"`)).join("");
parallax(scene);
const open = () => (scene.dataset.state = "open");
document.getElementById("open").onclick = open;
flower.onclick = open;
addEventListener("wheel", (e) => e.deltaY > 0 && open(), { passive: true });
addEventListener("keydown", (e) => (e.key === "ArrowDown" || e.key === " ") && open());
let turn = 30;
ring.style.transform = "rotateY(30deg)";
const rot = (by) => { turn += by; ring.style.transform = `rotateY(${turn}deg)`; };
document.getElementById("prev").onclick = () => rot(60);
document.getElementById("next").onclick = () => rot(-60);
</script>
</body>
</html>
