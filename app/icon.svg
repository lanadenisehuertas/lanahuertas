<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    The site icon: the nav's pixel butterfly (components/NavEmblem.tsx) on a
    dusk tile, the same sky as the top of the page. The PNG and ICO versions
    are drawn from the same cells, snapped to whole pixels at each size.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18192d"/>
      <stop offset="0.62" stop-color="#262a7c"/>
      <stop offset="1" stop-color="#5a4ab0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.82" r="0.48">
      <stop offset="0" stop-color="#c98cc4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c98cc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ec4"/>
      <stop offset="0.42" stop-color="#c9b8ff"/>
      <stop offset="0.58" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#ff9ec4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- four-point stars -->
  <path d="M102 79L107 97L125 102L107 107L102 125L97 107L79 102L97 97Z" fill="#fdf3e1"/>
  <path d="M425 123L428 135L440 138L428 141L425 153L422 141L410 138L422 135Z" fill="#fdf3e1"/>
  <path d="M379 53L381 59L387 61L381 63L379 69L377 63L371 61L377 59Z" fill="#fdf3e1"/>

  <!-- the butterfly: 24px cells, centred -->
  <g transform="translate(64 88) scale(24)" shape-rendering="crispEdges">
    <path d="M2 3h3v1h1v1h1v2h2V5h1V4h1V3h3v4h-1v1h-1v1h1v3h-2v-1h-1v-1H9v2H7v-2H6v1H5v1H3V9h1V8H3V7H2z" fill="url(#wing)"/>
    <path d="M3 4h1v1H3zM12 4h1v1h-1zM4 5h1v1H4zM11 5h1v1h-1z" fill="#ffe8f1"/>
    <path d="M4 10h1v1H4zM11 10h1v1h-1z" fill="#9a6fd8"/>
    <path d="M7 5h2v6H7z" fill="#fdf3e1"/>
    <path d="M6 3h1v1H6zM9 3h1v1H9zM5 2h1v1H5zM10 2h1v1h-1z" fill="#ffd98a"/>
  </g>
</svg>
