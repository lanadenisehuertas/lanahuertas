<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b6f0"/>
      <stop offset="0.45" stop-color="#c9b9ec"/>
      <stop offset="0.78" stop-color="#f2b8cf"/>
      <stop offset="1" stop-color="#f6d3c3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fff6ea" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#711e7b"/>
      <stop offset="0.6" stop-color="#b9379d"/>
      <stop offset="1" stop-color="#f2b8cf"/>
    </linearGradient>
    <linearGradient id="petal-in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#51017c"/>
      <stop offset="1" stop-color="#b9379d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- stem -->
  <path d="M256 448 C252 410 260 380 256 350" stroke="#4f9a78" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- lotus: outer petals fanned about the base -->
  <g transform="translate(256 350)">
    <path transform="rotate(-62)" d="M0 0 C-50 -44 -54 -134 0 -200 C54 -134 50 -44 0 0Z" fill="url(#petal)"/>
    <path transform="rotate(62)" d="M0 0 C-50 -44 -54 -134 0 -200 C54 -134 50 -44 0 0Z" fill="url(#petal)"/>
    <path transform="rotate(-31)" d="M0 0 C-54 -50 -56 -150 0 -222 C56 -150 54 -50 0 0Z" fill="url(#petal)"/>
    <path transform="rotate(31)" d="M0 0 C-54 -50 -56 -150 0 -222 C56 -150 54 -50 0 0Z" fill="url(#petal)"/>
    <path d="M0 0 C-60 -58 -60 -176 0 -250 C60 -176 60 -58 0 0Z" fill="url(#petal-in)"/>
    <path d="M0 -20 C-18 -70 -16 -150 0 -198 C16 -150 18 -70 0 -20Z" fill="#fff6ea" opacity="0.55"/>
  </g>

  <!-- sparkle -->
  <path transform="translate(372 78) scale(3.4)" d="M12 0C12.9 7.6 16.4 11.1 24 12C16.4 12.9 12.9 16.4 12 24C11.1 16.4 7.6 12.9 0 12C7.6 11.1 11.1 7.6 12 0Z" fill="#ffffff"/>
</svg>
